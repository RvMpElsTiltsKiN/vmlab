[package]
name = "vmlab-core"
version = "0.1.0"
edition = "2021"
description = "Lógica de VMLab sin dependencias de UI: validación, ejecución segura de VBoxManage/docker y planificación de redes."
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["process", "time", "macros", "rt", "io-util"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "io-util"] }
