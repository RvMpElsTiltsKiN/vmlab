[package]
name = "vmlab"
version = "0.1.0"
description = "VMLab: lienzo visual para gestionar laboratorios de VirtualBox y Docker"
authors = ["VMLab"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "vmlab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "sync", "time"] }
vmlab-core = { path = "../crates/vmlab-core" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
